[project]
name = "mkm-optimizer"
version = "0.1.0"
description = "Optimiseur d'achats Cardmarket — minimise coût total (cartes + FDP) en limitant le nombre de vendeurs."
requires-python = ">=3.11"
dependencies = [
    "selectolax>=0.3.21",   # parsing HTML rapide (10x BeautifulSoup) pour les pages MKM (10-20 Mo)
    "pulp>=2.8",            # solveur MIP avec CBC embarqué
    "pydantic>=2.6",        # modèles de données typés
    "pyyaml>=6.0",          # config + shipping_overrides
    "rich>=13.0",           # CLI / logs lisibles
    "typer>=0.12",          # CLI ergonomique
]

[project.optional-dependencies]
scrape = [
    "playwright>=1.42",     # Option B (étape suivante) : récupération HTML auto
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mkm-optim = "mkm_optimizer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
